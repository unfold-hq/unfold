name: '[Workflow] On Release Published'

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, selected as the workflow ref too, e.g. unfold-v0.4.0-rc.1 or unfold-site-v1.0.0-rc.1'
        required: true
        type: string

concurrency:
  group: release-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  parse-release-tag:
    if: github.repository == 'unfold-hq/unfold' && vars.UNFOLD_RELEASES_ENABLED == 'true' && startsWith(github.event.release.tag_name || inputs.tag, 'unfold-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.parse.outputs.version }}
      created: ${{ steps.parse.outputs.created }}
    steps:
      - id: parse
        shell: bash
        env:
          WORKFLOW_EVENT: ${{ github.event_name }}
          SELECTED_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
          RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
          RELEASE_CREATED_AT: ${{ github.event.release.created_at }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ "${WORKFLOW_EVENT:-}" == workflow_dispatch ]]; then
            [[ "${SELECTED_REF:-}" == "refs/tags/$tag" ]] || { echo "Select the same tag as the workflow ref before publishing." >&2; exit 1; }
          fi
          [[ "$tag" =~ ^unfold-v0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[1-9][0-9]*$ ]] || { echo "Unfold publishes only unfold-v0.x.y-rc.N tags; stable and 1.x releases require an explicit policy change." >&2; exit 1; }
          plausible() { local v="${1:-}"; [[ -n "$v" ]] || return 1; [[ "$v" =~ ^([0-9]{4})-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2} ]] || return 1; (( BASH_REMATCH[1] >= 2020 )); }
          created=""
          for cand in "${RELEASE_PUBLISHED_AT:-}" "${RELEASE_CREATED_AT:-}"; do
            [[ -n "$cand" ]] || continue
            if plausible "$cand"; then created="$cand"; break; fi
            echo "NOTE: release timestamp '$cand' is a zero time or implausible; ignoring it."
          done
          [[ -n "$created" ]] || created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          plausible "$created" || { echo "ERROR: IMAGE_CREATED is not a plausible instant: '$created'" >&2; exit 1; }
          echo "version=${tag#unfold-v}" >> "$GITHUB_OUTPUT"
          echo "created=$created" >> "$GITHUB_OUTPUT"

  unfold-release-build:
    name: Unfold - Build each image on its own platform (GHCR, per-platform build tag)
    needs: [parse-release-tag]
    if: github.repository == 'unfold-hq/unfold' && needs.parse-release-tag.outputs.version != ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      unfold-amd64: ${{ steps.build.outputs.unfold-amd64 }}
      unfold-arm64: ${{ steps.build.outputs.unfold-arm64 }}
      unfold-agent-amd64: ${{ steps.build.outputs.unfold-agent-amd64 }}
      unfold-agent-arm64: ${{ steps.build.outputs.unfold-agent-arm64 }}
    strategy:
      fail-fast: false
      matrix:
        name: [unfold, unfold-agent]
        arch: [amd64, arm64]
        include:
          - name: unfold
            context: apps/unfold
            dockerfile: apps/unfold/Dockerfile
            target: app
          - name: unfold-agent
            context: apps/unfold/ops/agent
            dockerfile: apps/unfold/ops/agent/Dockerfile
            target: ''
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ghcr.io/unfold-hq/${{ matrix.name }}
      VERSION: ${{ needs.parse-release-tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: unfold-v${{ needs.parse-release-tag.outputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - id: probe
        uses: ./.github/actions/ghcr-probe
        with:
          name: ${{ matrix.name }}
          version: ${{ needs.parse-release-tag.outputs.version }}
          token: ${{ github.token }}
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        if: steps.probe.outputs.exists != 'true' && matrix.name == 'unfold'
        with:
          version: 2026.10.25
          install_args: node
          cache: false
      - name: Record which release added each release note, for What's new in the image
        if: steps.probe.outputs.exists != 'true' && matrix.name == 'unfold'
        run: mise exec node -- node apps/unfold/scripts/changelog.ts resolve
      - name: Switch Docker to the containerd image store, so its own BuildKit pushes attestations and no BuildKit image is pulled
        if: steps.probe.outputs.exists != 'true'
        run: |
          set -euo pipefail
          config=/etc/docker/daemon.json
          current="$(sudo cat "$config" 2>/dev/null || echo '{}')"
          printf '%s' "$current" | jq '.features["containerd-snapshotter"] = true' | sudo tee "$config" > /dev/null
          sudo systemctl restart docker
          docker info --format '{{ json .DriverStatus }}' | grep -q io.containerd.snapshotter.v1 || { echo "Docker did not switch to the containerd image store." >&2; exit 1; }
      - name: Build and push this platform under its build tag (GHCR)
        id: build
        if: steps.probe.outputs.exists != 'true'
        env:
          NAME: ${{ matrix.name }}
          ARCH: ${{ matrix.arch }}
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          TARGET: ${{ matrix.target }}
          IMAGE_CREATED: ${{ needs.parse-release-tag.outputs.created }}
          SOURCE: https://github.com/unfold-hq/unfold
        run: |
          set -euo pipefail
          [ "$(docker version --format '{{ .Server.Arch }}')" = "$ARCH" ] || { echo "The runner does not build $ARCH natively." >&2; exit 1; }
          docker buildx build --builder default --progress=plain \
            --platform "linux/$ARCH" \
            --file "$DOCKERFILE" ${TARGET:+--target "$TARGET"} \
            --build-arg IMAGE_CREATED="$IMAGE_CREATED" \
            --build-arg IMAGE_VERSION="$VERSION" \
            --build-arg IMAGE_REVISION="$GITHUB_SHA" \
            --label org.opencontainers.image.source="$SOURCE" \
            --label org.opencontainers.image.url="$SOURCE" \
            --provenance=mode=max \
            --metadata-file "${RUNNER_TEMP}/build.json" \
            --output "type=image,name=${IMAGE}:build-${VERSION}-${ARCH},push=true" \
            "$CONTEXT"
          digest="$(jq -r '."containerimage.digest"' "${RUNNER_TEMP}/build.json")"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "no digest pushed for $IMAGE on $ARCH" >&2; exit 1; }
          echo "${NAME}-${ARCH}=$digest" >> "$GITHUB_OUTPUT"

  unfold-release-images:
    name: Unfold - Merge, gate, sign and attest images (GHCR)
    needs: [parse-release-tag, unfold-release-build]
    if: github.repository == 'unfold-hq/unfold' && needs.parse-release-tag.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      unfold-digest: ${{ steps.digest.outputs.digest-unfold }}
      unfold-agent-digest: ${{ steps.digest.outputs.digest-unfold-agent }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        name: [unfold, unfold-agent]
    env:
      IMAGE: ghcr.io/unfold-hq/${{ matrix.name }}
      VERSION: ${{ needs.parse-release-tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: unfold-v${{ needs.parse-release-tag.outputs.version }}
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
          install: false
          cache: false
      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - id: probe
        uses: ./.github/actions/ghcr-probe
        with:
          name: ${{ matrix.name }}
          version: ${{ needs.parse-release-tag.outputs.version }}
          token: ${{ github.token }}
      - name: Merge the AMD64 and ARM64 builds into one tagged index (GHCR)
        id: merge
        if: steps.probe.outputs.exists != 'true'
        env:
          AMD64: ${{ needs.unfold-release-build.outputs[format('{0}-amd64', matrix.name)] }}
          ARM64: ${{ needs.unfold-release-build.outputs[format('{0}-arm64', matrix.name)] }}
          SOURCE: https://github.com/unfold-hq/unfold
        run: |
          set -euo pipefail
          for digest in "$AMD64" "$ARM64"; do
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "a platform build left no digest for $IMAGE" >&2; exit 1; }
          done
          docker buildx imagetools create \
            --annotation index:org.opencontainers.image.source="$SOURCE" \
            --annotation index:org.opencontainers.image.url="$SOURCE" \
            --tag "$IMAGE:$VERSION" "$IMAGE@$AMD64" "$IMAGE@$ARM64"

      - name: Resolve the published digest
        id: digest
        env:
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{ .Manifest.Digest }}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "no digest resolved for $IMAGE:$VERSION" >&2; exit 1; }
          {
            echo "digest=$digest"
            echo "digest-${{ matrix.name }}=$digest"
            echo "ref=$IMAGE@${digest}"
          } >> "$GITHUB_OUTPUT"

      - name: CVE budget gate (grype + OpenVEX)
        uses: ./.github/actions/cve-gate
        with:
          image-ref: ${{ steps.digest.outputs.ref }}
          image-name: ${{ matrix.name }}
          budgets-file: apps/unfold/ops/security/cve-budgets.yaml
          vex-dir: apps/unfold/ops/vex/statements
          registry-username: ${{ github.actor }}
          registry-token: ${{ github.token }}

      - name: Sign keyless, then attest the SBOM and the CVE budget
        env:
          REF: ${{ steps.digest.outputs.ref }}
        run: |
          set -euo pipefail
          tools=(mise exec cosign@2.6.5 aqua:anchore/syft@1.55.0 --)
          "${tools[@]}" cosign sign --yes "$REF"
          "${tools[@]}" syft scan "registry:$REF" --output "cyclonedx-json=${RUNNER_TEMP}/sbom.cdx.json"
          "${tools[@]}" cosign attest --yes --type cyclonedx --predicate "${RUNNER_TEMP}/sbom.cdx.json" "$REF"
          for arch in amd64 arm64; do
            platform="$(docker buildx imagetools inspect --raw "$REF" | jq -r --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')"
            [[ "$platform" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "$REF holds no single linux/$arch image" >&2; exit 1; }
            "${tools[@]}" syft scan "registry:$IMAGE@$platform" --output "cyclonedx-json=${RUNNER_TEMP}/sbom-$arch.cdx.json"
            "${tools[@]}" cosign attest --yes --type cyclonedx --predicate "${RUNNER_TEMP}/sbom-$arch.cdx.json" "$IMAGE@$platform"
          done
          "${tools[@]}" cosign attest --yes --type https://unfoldhq.dev/attestations/cve-budget/v1 --predicate cve-budget.json "$REF"
          "${tools[@]}" cosign verify \
            --certificate-identity-regexp '^https://github\.com/unfold-hq/unfold/\.github/workflows/on_release_published\.yml@refs/tags/unfold-v0\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$REF" > /dev/null
          echo "- \`$REF\` signed keyless by this workflow, with a CycloneDX SBOM per platform and its CVE budget attested" >> "$GITHUB_STEP_SUMMARY"

  unfold-release-publish-chart:
    name: Unfold - Publish and sign Helm chart (GHCR)
    needs: [parse-release-tag, unfold-release-images]
    if: github.repository == 'unfold-hq/unfold' && needs.parse-release-tag.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: unfold-v${{ needs.parse-release-tag.outputs.version }}
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
          install_args: node
          cache: false
      - name: Stamp the release version into the chart
        shell: bash
        env:
          VERSION: ${{ needs.parse-release-tag.outputs.version }}
        run: node apps/unfold/scripts/stamp-version.mjs "$VERSION" chart
      - name: Publish, sign and verify the canonical chart
        shell: bash
        env:
          VERSION: ${{ needs.parse-release-tag.outputs.version }}
          UNFOLD_IMAGE_DIGEST: ${{ needs.unfold-release-images.outputs.unfold-digest }}
          UNFOLD_AGENT_IMAGE_DIGEST: ${{ needs.unfold-release-images.outputs.unfold-agent-digest }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DOCKER_CONFIG="$(mktemp -d)"
          export DOCKER_CONFIG
          export HELM_REGISTRY_CONFIG="$DOCKER_CONFIG/config.json"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          mise exec helm cosign@2.6.5 -- python3 scripts/publish_chart.py unfold "$VERSION"

  unfold-release-publish-extension:
    name: Unfold - Publish VS Code extension
    needs: [parse-release-tag]
    if: github.repository == 'unfold-hq/unfold' && needs.parse-release-tag.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.parse-release-tag.outputs.version }}
      TAG: unfold-v${{ needs.parse-release-tag.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: unfold-v${{ needs.parse-release-tag.outputs.version }}
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
          install_args: node
          cache: false
      - name: Stamp the release version into the tagged tree
        shell: bash
        run: node apps/unfold/scripts/stamp-version.mjs "$VERSION"
      - name: Name the Marketplace version
        shell: bash
        run: echo "MARKETPLACE_VERSION=$(python3 scripts/marketplace_version.py "$VERSION")" >> "$GITHUB_ENV"
      - name: Reuse the VSIXes already on the release, or package them from the tagged tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./apps/unfold/extensions/vscode/package.json').version")" = "$VERSION"
          npm ci --no-audit --no-fund --prefix apps/unfold/extensions/vscode
          cd apps/unfold/extensions/vscode
          package_or_reuse() {
            local vsix="$1" version="$2"
            if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$vsix" --pattern "${vsix}.sha256" --clobber 2>/dev/null && [ -s "$vsix" ]; then
              sha256sum -c "${vsix}.sha256"
              echo "Reusing $vsix from $TAG, so a retry publishes the same bytes."
              return
            fi
            rm -f "$vsix" "${vsix}.sha256"
            local prerelease=()
            [[ "$VERSION" == *-* ]] && prerelease=(--pre-release)
            npm pkg set version="$version"
            npm run package -- --out "$vsix" "${prerelease[@]}"
            npm pkg set version="$VERSION"
            test -s "$vsix"
            sha256sum "$vsix" > "${vsix}.sha256"
          }
          package_or_reuse "unfold-${VERSION}.vsix" "$VERSION"
          if [ "$MARKETPLACE_VERSION" != "$VERSION" ]; then
            package_or_reuse "unfold-marketplace-${MARKETPLACE_VERSION}.vsix" "$MARKETPLACE_VERSION"
          fi
      - name: Verify the listing and the packaged contents
        shell: bash
        run: |
          set -euo pipefail
          VSIX_PATH="extensions/vscode/unfold-${VERSION}.vsix" npm --prefix apps/unfold run extension:verify
          if [ "$MARKETPLACE_VERSION" != "$VERSION" ]; then
            VSIX_PATH="extensions/vscode/unfold-marketplace-${MARKETPLACE_VERSION}.vsix" npm --prefix apps/unfold run extension:verify
          fi
      - name: Sign the VSIXes keyless and verify the signatures with cosign verify-blob
        shell: bash
        working-directory: apps/unfold/extensions/vscode
        run: |
          set -euo pipefail
          tools=(mise exec cosign@2.6.5 --)
          for vsix in unfold-*.vsix; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "${vsix}.sigstore.json" --clobber 2>/dev/null || "${tools[@]}" cosign sign-blob --yes --bundle "${vsix}.sigstore.json" "$vsix"
            "${tools[@]}" cosign verify-blob --bundle "${vsix}.sigstore.json" \
              --certificate-identity-regexp '^https://github\.com/unfold-hq/unfold/\.github/workflows/on_release_published\.yml@refs/tags/unfold-v0\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$vsix"
          done
      - name: Attest the VSIXes' build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: apps/unfold/extensions/vscode/unfold-*.vsix
      - name: Attach the VSIXes, their checksums and their signature bundles to the draft release
        shell: bash
        working-directory: apps/unfold/extensions/vscode
        run: |
          set -euo pipefail
          attached="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for vsix in unfold-*.vsix; do
            for asset in "$vsix" "${vsix}.sha256" "${vsix}.sigstore.json"; do
              if grep -qx "$asset" <<< "$attached"; then
                echo "$asset is already on $TAG."
              else
                gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$asset"
              fi
            done
          done
      - name: Publish to Open VSX with Trusted Publishing
        shell: bash
        run: |
          set -euo pipefail
          cd apps/unfold/extensions/vscode
          ovsx="$(node -p "require('ovsx/package.json').version")"
          [ "$(printf '%s\n1.4.0\n' "$ovsx" | sort -V | head -1)" = 1.4.0 ] || { echo "::error::ovsx $ovsx cannot publish with --trusted-publishing; it needs 1.4.0 or newer in apps/unfold/extensions/vscode/package.json."; echo "- Open VSX: **failed**, ovsx $ovsx predates Trusted Publishing" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          npx --no-install ovsx publish --packagePath "unfold-${VERSION}.vsix" --skip-duplicate --trusted-publishing
          echo "- Open VSX: published \`$(node -p "const m=require('./package.json'); m.publisher+'.'+m.name")\` ${VERSION} with Trusted Publishing" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to the Visual Studio Marketplace with Trusted Publishing
        shell: bash
        run: |
          set -euo pipefail
          paused="$(python3 scripts/marketplace_version.py --paused)"
          if [ -n "$paused" ]; then
            echo "::notice::Visual Studio Marketplace publication is paused: ${paused}."
            echo "- Visual Studio Marketplace: **skipped**, publication is paused: ${paused}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cd apps/unfold/extensions/vscode
          vsix="unfold-${VERSION}.vsix"
          channel=release
          if [ "$MARKETPLACE_VERSION" != "$VERSION" ]; then
            vsix="unfold-marketplace-${MARKETPLACE_VERSION}.vsix"
            channel=pre-release
          fi
          npx --no-install vsce publish --packagePath "$vsix" --skip-duplicate --oidc
          echo "- Visual Studio Marketplace: published \`$(node -p "const m=require('./package.json'); m.publisher+'.'+m.name")\` ${MARKETPLACE_VERSION} for ${VERSION} as a ${channel} with Trusted Publishing" >> "$GITHUB_STEP_SUMMARY"

  unfold-release-distribute:
    name: Unfold - Verify every destination and publish the release
    needs: [parse-release-tag, unfold-release-images, unfold-release-publish-chart, unfold-release-publish-extension]
    if: github.repository == 'unfold-hq/unfold' && needs.parse-release-tag.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: unfold-v${{ needs.parse-release-tag.outputs.version }}
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
          install: false
          cache: false
      - name: Verify every artifact anonymously, attach the evidence and take the release out of draft
        shell: bash
        env:
          VERSION: ${{ needs.parse-release-tag.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: mise exec cosign@2.6.5 -- python3 scripts/publish_release.py unfold "$VERSION"

  site-release-tag:
    if: github.repository == 'unfold-hq/unfold'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.site.outputs.channel }}
    steps:
      - id: site
        shell: bash
        env:
          WORKFLOW_EVENT: ${{ github.event_name }}
          SELECTED_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
          RELEASES_ENABLED: ${{ vars.UNFOLD_RELEASES_ENABLED }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ "${RELEASES_ENABLED:-}" != true || ( "$tag" != unfold-site-v* && "$tag" != unfold-v* ) ]]; then
            echo "channel=none" >> "$GITHUB_OUTPUT"
            echo "${tag:-This release} is neither a site nor an Unfold release; the site is not deployed."
            exit 0
          fi
          if [[ "${WORKFLOW_EVENT:-}" == workflow_dispatch ]]; then
            [[ "${SELECTED_REF:-}" == "refs/tags/$tag" ]] || { echo "Select the same tag as the workflow ref before deploying." >&2; exit 1; }
          fi
          if [[ "$tag" == unfold-site-v* ]]; then
            [[ "$tag" =~ ^unfold-site-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]] || { echo "The site deploys only unfold-site-vX.Y.Z or unfold-site-vX.Y.Z-rc.N tags." >&2; exit 1; }
          else
            [[ "$tag" =~ ^unfold-v0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[1-9][0-9]*$ ]] || { echo "An Unfold release redeploys staging only from unfold-v0.x.y-rc.N tags." >&2; exit 1; }
          fi
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo "The Cloudflare deploy credential is missing: set the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID." >&2; exit 1; }
          if [[ "$tag" == *-rc.* ]]; then
            echo "channel=prerelease" >> "$GITHUB_OUTPUT"
            echo "Deploying ${tag} to staging."
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "Deploying ${tag} to production."
          fi

  site-deploy-staging:
    needs: [site-release-tag]
    if: github.repository == 'unfold-hq/unfold' && needs.site-release-tag.outputs.channel == 'prerelease'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: site-deploy-prerelease
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
          install: false
          cache: false
      - name: Install the site's and Unfold's runtime dependencies
        run: |
          set -euo pipefail
          mise trust apps/unfold/mise.toml
          mise trust apps/site/mise.toml
          mise -C apps/site install
          mise -C apps/site exec -- npm --prefix ../unfold ci --omit=dev --no-audit --no-fund
          mise -C apps/site exec -- corepack enable pnpm
          mise -C apps/site exec -- corepack pnpm install --frozen-lockfile
      - name: Build the release
        working-directory: apps/site
        env:
          UNFOLD_SITE_URL: https://staging.unfoldhq.dev
        run: mise exec -- corepack pnpm run build:release
      - name: Deploy with wrangler
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: mise exec -- corepack pnpm exec wrangler deploy --env staging
      - name: Verify the live edge
        uses: ./.github/actions/edge-verify
        with:
          origin: https://staging.unfoldhq.dev
          working-directory: apps/site
          smoke-paths: |
            /
            /nl
            /robots.txt
            /sitemap-index.xml
            /favicon.svg
            /demo/
            /demo/replay/replay.json
            /privacy
            /nl/privacy
          not-found-path: /this-page-does-not-exist

  site-deploy-production:
    needs: [site-release-tag]
    if: github.repository == 'unfold-hq/unfold' && needs.site-release-tag.outputs.channel == 'stable'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: site-deploy-stable
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
          install: false
          cache: false
      - name: Install the site's and Unfold's runtime dependencies
        run: |
          set -euo pipefail
          mise trust apps/unfold/mise.toml
          mise trust apps/site/mise.toml
          mise -C apps/site install
          mise -C apps/site exec -- npm --prefix ../unfold ci --omit=dev --no-audit --no-fund
          mise -C apps/site exec -- corepack enable pnpm
          mise -C apps/site exec -- corepack pnpm install --frozen-lockfile
      - name: Build the release
        working-directory: apps/site
        env:
          UNFOLD_SITE_URL: https://unfoldhq.dev
        run: mise exec -- corepack pnpm run build:release
      - name: Deploy with wrangler
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: mise exec -- corepack pnpm exec wrangler deploy
      - name: Verify the live edge
        uses: ./.github/actions/edge-verify
        with:
          origin: https://unfoldhq.dev
          working-directory: apps/site
          smoke-paths: |
            /
            /nl
            /robots.txt
            /sitemap-index.xml
            /favicon.svg
            /demo/
            /demo/replay/replay.json
            /privacy
            /nl/privacy
          not-found-path: /this-page-does-not-exist
