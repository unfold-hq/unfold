name: '[Workflow] On Pull Request'

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:
  workflow_dispatch:

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    if: github.repository == 'unfold-hq/unfold' && (github.event_name != 'pull_request' || github.base_ref != 'development' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      warnings: ${{ steps.verify.outputs.warnings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: verify
        uses: ./.github/actions/verify
        with:
          except: unfold

  checks-unfold:
    if: github.repository == 'unfold-hq/unfold' && (github.event_name != 'pull_request' || github.base_ref != 'development' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      warnings: ${{ steps.verify.outputs.warnings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: verify
        uses: ./.github/actions/verify
        with:
          only: unfold
          setup: setup-unfold

  warnings:
    needs: [checks, checks-unfold]
    if: github.repository == 'unfold-hq/unfold' && always() && needs.checks.result != 'skipped' && needs.checks.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail when setup or verification printed a warning
        env:
          CHECKS: ${{ needs.checks.outputs.warnings }}
          UNFOLD: ${{ needs.checks-unfold.outputs.warnings }}
        run: |
          REPORT=$(printf '%s\n%s\n' "$CHECKS" "$UNFOLD" | sed '/^$/d')
          if [ -z "$REPORT" ]; then
            echo "No warnings in setup and verification output."
            exit 0
          fi
          echo "Setup or verification printed warnings. Fix them, or accept one with a reason in scripts/ci-warnings-allow.json:"
          printf '%s\n' "$REPORT"
          exit 1

  agent-trace:
    if: github.repository == 'unfold-hq/unfold'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
          install_args: node
          cache: false
      - name: Read the Agent Trace notes from origin, read-only
        run: git fetch --no-tags origin 'refs/notes/agent-trace:refs/notes/agent-trace' || echo "origin holds no Agent Trace notes."
      - name: Summarise which lines agents wrote, without blocking the pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          mise exec node -- node apps/unfold/extensions/claude-code/scripts/agent-trace-report.mjs --base "${BASE:-origin/development}" --head "${HEAD_SHA:-HEAD}" > agent-trace.md || echo "The Agent Trace report did not run." > agent-trace.md
          cat agent-trace.md
          cat agent-trace.md >> "$GITHUB_STEP_SUMMARY" || true

  agents-check:
    if: github.repository == 'unfold-hq/unfold'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MISE_AUTO_INSTALL: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
          install_args: uv pipx:apm-cli node npm:@fission-ai/openspec
          cache: false
      - name: Check the generated agent files against .apm
        run: mise run agents-check

  opencode-contract:
    if: github.repository == 'unfold-hq/unfold'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MISE_AUTO_INSTALL: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
          install_args: node
          cache: false
      - run: mise trust apps/unfold/mise.toml
      - run: mise -C apps/unfold exec -- npm ci
      - run: mise -C apps/unfold run opencode-contract
        env:
          UNFOLD_TEST_TIMEOUT_SCALE: '2'

  typecheck:
    if: github.repository == 'unfold-hq/unfold'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MISE_AUTO_INSTALL: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
          install_args: node
          cache: false
      - run: mise trust apps/unfold/mise.toml
      - run: mise -C apps/unfold exec -- npm ci
      - name: Typecheck Unfold
        run: mise -C apps/unfold exec -- npm run typecheck

  vscode-integration:
    if: github.repository == 'unfold-hq/unfold'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MISE_AUTO_INSTALL: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run the suite only when the change touches the VS Code extension or this workflow
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || git diff --name-only "${BASE:-origin/development}...${HEAD_SHA:-HEAD}" -- apps/unfold/extensions/vscode .github/workflows/on_pull_request.yml | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No change under apps/unfold/extensions/vscode; the VS Code integration suite does not run."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
          install_args: node
          cache: false
      - if: steps.scope.outputs.run == 'true'
        name: Install Unfold's and the extension's packages
        run: |
          mise trust apps/unfold/mise.toml
          mise -C apps/unfold exec -- npm ci --no-audit --no-fund
          mise -C apps/unfold exec -- npm ci --no-audit --no-fund --prefix extensions/vscode
      - if: steps.scope.outputs.run == 'true'
        name: Run the extension in VS Code Stable and Insiders against the deterministic demo, headless
        run: xvfb-run -a mise run vscode-integration

  build-contexts:
    if: github.repository == 'unfold-hq/unfold' && (github.event_name != 'pull_request' || github.base_ref != 'development' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-contexts

  ploeg-pin:
    if: github.repository == 'unfold-hq/unfold'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
          install_args: uv
          cache: false
      - name: Unpack the pinned Ploeg contract bundle, verifying its digest
        run: mise exec uv -- uv run --no-project python scripts/ploeg-contract.py fetch
      - name: Require the pin to be a published Ploeg release whose bundle and Go module agree
        run: mise exec uv -- uv run --no-project python scripts/ploeg-contract.py check --published

  ploeg-docs:
    if: github.repository == 'unfold-hq/unfold'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
          install_args: uv
          cache: false
      - name: Unpack the pinned Ploeg contract bundle, verifying its digest
        run: mise exec uv -- uv run --no-project python scripts/ploeg-contract.py fetch
      - name: Require the glossary and decision register to match the pinned Ploeg's domain model and ADRs
        run: mise exec uv -- uv run --frozen python scripts/docs.py --domain-check
      - name: Require every documentation link into the pinned Ploeg to resolve
        run: mise exec uv -- uv run --frozen python scripts/docs.py --stage-only

  release-policy:
    if: github.repository == 'unfold-hq/unfold'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
          install_args: node
          cache: false
      - name: Install the release toolchain from its lockfile
        run: mise exec node -- npm ci --prefix scripts/release-config --omit=dev --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/release-policy

  release-notes:
    if: github.repository == 'unfold-hq/unfold'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
          install_args: node
          cache: false
      - name: Require a release note for a change people using Unfold will notice
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: mise exec node -- node apps/unfold/scripts/changelog.ts require --base "${BASE:-origin/development}" --head "${HEAD_SHA:-HEAD}"

  gitleaks:
    if: github.repository == 'unfold-hq/unfold'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the commits this pull request adds for secrets, with the repository's gitleaks rules
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: >-
          docker run --rm --network none --user "$(id -u):$(id -g)"
          -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --log-opts="${BASE:-origin/development}..${HEAD_SHA:-HEAD}" --no-banner --redact

  gate:
    needs: [checks, checks-unfold, build-contexts, gitleaks, agents-check, opencode-contract, typecheck, vscode-integration, ploeg-pin, ploeg-docs, release-policy, release-notes]
    if: github.repository == 'unfold-hq/unfold' && always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job that had to run to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          FULL: ${{ github.event_name != 'pull_request' || github.base_ref != 'development' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          printf '%s\n' "$NEEDS"
          if [ "$FULL" = true ]; then
            optional='[]'
            echo "Full run: every job the gate waits for must succeed."
          else
            optional='["checks", "checks-unfold", "build-contexts"]'
            echo "Fast run: checks, checks-unfold and build-contexts run in the merge queue, or here with the full-ci label."
          fi
          failed=$(jq -r --argjson optional "$optional" 'if length == 0 then "no job" else [to_entries[] | select(.value.result != "success") | select((.value.result == "skipped" and (.key as $name | $optional | index($name))) | not) | .key] | join(" ") end' <<< "$NEEDS") || failed="unreadable results"
          if [ -n "$failed" ]; then
            echo "A job the gate waits for did not succeed, or the gate read no results: $failed"
            exit 1
          fi
          echo "Every job the gate waits for succeeded."
