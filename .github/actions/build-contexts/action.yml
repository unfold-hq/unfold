name: Build the container contexts
description: Build both Unfold images into the runner's image store and hold each to its CVE budget; every base pulls without credentials, so a pull request from a fork builds them too
runs:
  using: composite
  steps:
    - name: Container build contexts
      shell: bash
      run: |
        set -euo pipefail
        build() { docker build --progress=plain "$@"; }
        build --file apps/unfold/Dockerfile --target app --tag unfold:context apps/unfold &
        app=$!
        build --file apps/unfold/ops/agent/Dockerfile --tag unfold-agent:context apps/unfold/ops/agent
        wait "$app"
    - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      with:
        version: 2026.10.25
        install: false
        cache: false
    - name: CVE budget of the workbench image
      uses: ./.github/actions/cve-gate
      with:
        image-ref: unfold:context
        image-source: docker
        image-name: unfold
        budgets-file: apps/unfold/ops/security/cve-budgets.yaml
        vex-dir: apps/unfold/ops/vex/statements
    - name: CVE budget of the agent image
      uses: ./.github/actions/cve-gate
      with:
        image-ref: unfold-agent:context
        image-source: docker
        image-name: unfold-agent
        budgets-file: apps/unfold/ops/security/cve-budgets.yaml
        vex-dir: apps/unfold/ops/vex/statements
